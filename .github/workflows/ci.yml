name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rails: ${{ steps.filter.outputs.rails }}
      swift: ${{ steps.filter.outputs.swift }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected applications
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

          rails=false
          swift=false
          workflow=false

          while IFS= read -r file; do
            case "$file" in
              backend/*|compose.yml)
                rails=true
                ;;
            esac

            case "$file" in
              ios/*)
                swift=true
                ;;
            esac

            case "$file" in
              .github/workflows/*)
                workflow=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          {
            echo "rails=$rails"
            echo "swift=$swift"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CI targets"
            echo "- Rails: $rails"
            echo "- Swift: $swift"
            echo "- GitHub Actions: $workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  actions-lint:
    name: Actions lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint with reviewdog
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: error

  rails:
    name: Rails CI
    needs: changes
    if: needs.changes.outputs.rails == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Prepare test databases
        run: bin/rails db:prepare

      - name: Audit gems
        run: bin/bundler-audit

      - name: Run RSpec
        run: bundle exec rspec

      - name: Verify seeds
        run: bin/rails db:seed:replant

      - name: Run RuboCop with reviewdog
        uses: reviewdog/action-rubocop@b6d5e953a5fc0bf3ab65254e77730ea2174d6d6d # v2.22.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: warning
          workdir: backend
          skip_install: true
          use_bundler: true

  swift:
    name: Swift CI
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift tools
        run: brew install swiftlint xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift tests
        run: >-
          xcodebuild test
          -project Hitoshiori.xcodeproj
          -scheme Hitoshiori
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          CODE_SIGNING_ALLOWED=NO

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Run SwiftLint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swiftlint lint --no-cache --config .swiftlint.yml --reporter checkstyle > "$RUNNER_TEMP/swiftlint.xml" || true

          if [[ ! -s "$RUNNER_TEMP/swiftlint.xml" ]]; then
            echo "SwiftLint did not produce a report" >&2
            exit 1
          fi

          reviewdog \
            -f=checkstyle \
            -name=SwiftLint \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=warning \
            -tee \
            < "$RUNNER_TEMP/swiftlint.xml"
